<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="356" viewBox="0 0 1280 356" role="img" aria-label="better-auth-vetto: Block disposable sign-ups before the user row exists. No API calls.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#9db4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9db4ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 19px; }
      .row { opacity: 0; animation: in .5s ease-out forwards; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="356" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="356" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="355" rx="20" fill="none" stroke="#dfe3ee"/>
  <g class="sans">
    <circle cx="76" cy="70" r="6" fill="#0f9f6e" class="pulse"/>
    <text x="94" y="76" font-size="16" font-weight="600" letter-spacing="1.5" fill="#6b7390">BETTER AUTH PLUGIN · OFFLINE · MIT</text>
    <text x="64" y="122" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#0b0d14">better-auth-vetto</text>
    <text x="64" y="160" font-size="21" fill="#343b52">Block disposable sign-ups before the user row exists. No API calls.</text>
  </g>
  
    <g class="row" style="animation-delay:0.35s">
      <rect x="64" y="184" width="1152" height="40" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
      <text x="88" y="210" class="mono" fill="#343b52">signUp({ email: "x7@mailinator.com" })</text>
      <text x="1192" y="210" class="mono" text-anchor="end" fill="#d93b3b">✕  400  disposable domain</text>
    </g>
    <g class="row" style="animation-delay:0.8s">
      <rect x="64" y="234" width="1152" height="40" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
      <text x="88" y="260" class="mono" fill="#343b52">signUp({ email: "me@privaterelay.appleid.com" })</text>
      <text x="1192" y="260" class="mono" text-anchor="end" fill="#0f9f6e">✓  allowed  privacy relay</text>
    </g>
    <g class="row" style="animation-delay:1.25s">
      <rect x="64" y="284" width="1152" height="40" rx="10" fill="#ffffff" stroke="#dfe3ee"/>
      <text x="88" y="310" class="mono" fill="#343b52">canonicalEmail("j.a.n.e+trial7@googlemail.com")</text>
      <text x="1192" y="310" class="mono" text-anchor="end" fill="#c2620f">↻  "jane@gmail.com"</text>
    </g>
</svg>
